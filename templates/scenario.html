<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scenario Practice - {{ language|title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-md mb-6 flex justify-between items-center">
        <a href="/{{ language }}" class="text-blue-600 hover:text-blue-800">
            <i class="fas fa-arrow-left"></i> Back
        </a>
        <h1 class="text-2xl font-bold text-gray-800">{{ language|title }} Scenarios</h1>
    </div>

    <div class="w-full max-w-md bg-white rounded-xl shadow-md p-6 mb-6">
        <label class="block text-gray-700 text-sm font-bold mb-2">Choose a Scenario:</label>
        <select id="scenarioSelect" class="w-full p-3 border rounded-lg bg-gray-50 mb-4">
            {% for key, info in scenarios.items() %}
            <option value="{{ key }}">{{ info.name }}</option>
            {% endfor %}
        </select>
        <p id="scenarioDesc" class="text-gray-600 italic text-sm mb-4">
            </p>
        <button onclick="resetScenario()" class="text-xs text-red-500 underline">Reset Conversation</button>
    </div>

    <div class="w-full max-w-md bg-white rounded-xl shadow-md overflow-hidden flex flex-col h-[500px]">
        
        <div id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50">
            <div class="text-center text-gray-400 text-sm mt-4">
                Select a scenario and start speaking!
            </div>
        </div>

        <div class="p-4 bg-white border-t border-gray-200 flex justify-center items-center space-x-4">
            <button id="recordBtn" class="w-16 h-16 rounded-full bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center shadow-lg transition-all transform hover:scale-105 focus:outline-none">
                <i class="fas fa-microphone text-2xl"></i>
            </button>
            <div id="status" class="text-sm text-gray-500 font-medium hidden">Thinking...</div>
        </div>
    </div>

    <audio id="audioPlayer" class="hidden"></audio>

    <script>
        // Generate a random Session ID for this page load
        const sessionId = crypto.randomUUID();
        const language = "{{ language }}";
        
        // Scenarios Data injected from Python
        const scenariosData = {{ scenarios | tojson }};
        
        const recordBtn = document.getElementById('recordBtn');
        const statusDiv = document.getElementById('status');
        const chatContainer = document.getElementById('chatContainer');
        const scenarioSelect = document.getElementById('scenarioSelect');
        const scenarioDesc = document.getElementById('scenarioDesc');
        const audioPlayer = document.getElementById('audioPlayer');

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        // Update description on change
        function updateDesc() {
            const key = scenarioSelect.value;
            scenarioDesc.textContent = scenariosData[key].description;
        }
        scenarioSelect.addEventListener('change', updateDesc);
        updateDesc(); // Init

        // Reset Session
        async function resetScenario() {
            const formData = new FormData();
            formData.append('session_id', sessionId);
            await fetch('/api/reset-session', { method: 'POST', body: formData });
            chatContainer.innerHTML = '<div class="text-center text-gray-400 text-sm mt-4">Conversation reset. Start speaking!</div>';
        }

        // Recording Logic
        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        });

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                mediaRecorder.onstop = sendAudio;

                mediaRecorder.start();
                isRecording = true;
                recordBtn.classList.remove('bg-blue-600');
                recordBtn.classList.add('bg-red-600', 'animate-pulse');
                recordBtn.innerHTML = '<i class="fas fa-stop text-2xl"></i>';
            } catch (err) {
                alert("Microphone access denied");
            }
        }

        function stopRecording() {
            mediaRecorder.stop();
            isRecording = false;
            recordBtn.classList.add('bg-blue-600');
            recordBtn.classList.remove('bg-red-600', 'animate-pulse');
            recordBtn.innerHTML = '<i class="fas fa-microphone text-2xl"></i>';
            statusDiv.classList.remove('hidden');
        }

        async function sendAudio() {
            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
            const formData = new FormData();
            formData.append('audio', audioBlob, 'input.wav');
            formData.append('language', language);
            formData.append('scenario', scenarioSelect.value);
            formData.append('session_id', sessionId);

            try {
                const response = await fetch('/api/scenario-chat', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error("Server Error");
                const data = await response.json();
                
                addMessage('You', data.transcribedText, data.translatedUserText, true);
                addMessage('Assistant', data.botResponse, data.botResponseEnglish, false);

                // Play Audio
                audioPlayer.src = `/api/audio/${data.audioId}`;
                audioPlayer.play();

            } catch (e) {
                console.error(e);
                alert("Something went wrong.");
            } finally {
                statusDiv.classList.add('hidden');
            }
        }

        function addMessage(role, text, translation, isUser) {
            const div = document.createElement('div');
            div.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'}`;
            
            const bubble = document.createElement('div');
            bubble.className = `max-w-[80%] p-3 rounded-lg shadow ${isUser ? 'bg-blue-100 text-blue-900' : 'bg-white text-gray-900 border'}`;
            
            bubble.innerHTML = `
                <div class="font-medium mb-1">${text}</div>
                <div class="text-xs opacity-75 border-t border-gray-300 pt-1 mt-1">${translation}</div>
            `;

            div.appendChild(bubble);
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
