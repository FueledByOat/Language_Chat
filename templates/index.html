<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bilingual Chat Assistant</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="home-body">
    <div class="home-container">
        <header class="home-header">
            <h1>Language Learning Assistant</h1>
            <div class="language-icons">
                <div class="icon chinese">中</div>
                <div class="icon japanese">日</div>
            </div>
        </header>
        <main class="home-main">
            <p class="welcome-text">Welcome to your language assistant. Select an experience to begin.</p>
            <div class="language-selection">
                <a href="{{ url_for('language_image', language='chinese')}}" class="language-card chinese">
                    <div class="card-decoration"></div>
                    <h2>中国图片</h2>
                    <p>Chinese Image</p>
                </a>
                <a href="{{ url_for('chinese') }}" class="language-card chinese">
                    <div class="card-decoration"></div>
                    <h2>中文聊天</h2>
                    <p>Chinese Chat</p>
                </a>
                <a href="{{ url_for('language_image', language='japanese') }}" class="language-card japanese">
                    <div class="card-decoration"></div>
                    <h2>日本ピクチャーズ</h2>
                    <p>Japanese Image</p>
                </a>
                <a href="{{ url_for('japanese') }}" class="language-card japanese">
                    <div class="card-decoration"></div>
                    <h2>日本語</h2>
                    <p>Japanese Chat</p>
                </a>
            </div>
        </main>
        <footer class="home-footer">
            <p>Powered by Python NLP</p>
        </footer>
    </div>
</body>
</html>
